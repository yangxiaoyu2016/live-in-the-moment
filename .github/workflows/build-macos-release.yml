name: Build macOS Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to upload macOS assets to
        required: true
        default: v0.2.6

permissions:
  contents: write

jobs:
  build-macos:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-latest
            asset: LiveInTheMoment-macOS-arm64.app.zip
          - label: macOS Intel
            runner: macos-15-intel
            asset: LiveInTheMoment-macOS-intel.app.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build macOS app
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "LiveInTheMoment" \
            --collect-all PIL \
            --collect-all cryptography \
            --paths "src" \
            "gui_launcher.py"

      - name: Package app
        run: |
          test -d "dist/LiveInTheMoment.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/LiveInTheMoment.app" "${{ matrix.asset }}"
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" "${{ matrix.asset }}" "${{ matrix.asset }}.sha256" --clobber
