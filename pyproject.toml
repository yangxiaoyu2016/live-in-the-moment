[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "live-in-the-moment"
version = "0.2.6"
description = "Archive your own WeChat Moments text and local cached images into portable files."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yang" }]
keywords = ["wechat", "moments", "archive", "export"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = [
  "cryptography>=42.0.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/OWNER/live-in-the-moment"
Issues = "https://github.com/OWNER/live-in-the-moment/issues"

[project.scripts]
limm = "live_in_the_moment.cli:main"
limm-gui = "live_in_the_moment.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
